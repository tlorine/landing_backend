# Analytics same-origin proxy template. Adapt in the actual frontend TLS vhost.
# These limit_req_zone directives belong in http {}, not server/location.
limit_req_zone $binary_remote_addr zone=analytics_ingest:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=analytics_reports:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=analytics_login:10m rate=10r/m;

# The following locations belong inside the FRONTEND HTTPS server block.
# API origin remains bound to loopback/private network. Never use proxy caching here.
location = /api/v1/admin/auth/login {
    client_max_body_size 4k;
    limit_req zone=analytics_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CF-IPCountry "";
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
}
location /api/v1/admin/ {
    limit_req zone=analytics_reports burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CF-IPCountry "";
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
}
location = /api/v1/analytics/events {
    client_max_body_size 32k;
    limit_req zone=analytics_ingest burst=30 nodelay;
    limit_req_status 429;
    access_log off;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CF-IPCountry "";
}
# Defaults strip CF data (country unknown) and are safe without Cloudflare.
# For accurate countries, use the deployment's maintained CF ranges/firewall and
# explicitly sanitized client headers. Only then pass validated CF headers,
# configure TRUSTED_PROXY_CIDRS and enable TRUST_CLOUDFLARE_HEADERS on the API.
# Do not blindly replace these empty values with incoming request headers.
# If behind nginx, login peers otherwise share its IP bucket: configure the trusted
# edge client context before production login limiting, or enforce distributed
# per-client login limit at edge while retaining per-account DB limits.
