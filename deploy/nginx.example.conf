# Example reverse-proxy location for the API. Replace api.example.com and TLS paths.
# Put this location inside an HTTPS server block with valid certificates.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # Configure ssl_certificate and ssl_certificate_key for your domain.
    client_max_body_size 64k;

    location / {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
